<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money - Sign In</title>

  <!-- SUPABASE CDN SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #000000; display: flex; flex-direction: column; height: 100vh; color: #ffffff; }
    .header-section { padding: 3rem 2rem; flex-shrink: 0; }
    .logo { width: 48px; height: 48px; background-color: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: white; margin-bottom: 1.5rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    p { color: #9ca3af; font-size: 1.1rem; }
    .form-section { background-color: #f9fafb; flex-grow: 1; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 2.5rem 2rem; color: #000000; overflow-y: auto; }
    .form-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
    .input-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; }
    input { width: 100%; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 1rem; outline: none; }
    input:focus { border-color: #000000; }
    .submit-btn { width: 100%; padding: 1.2rem; background-color: #000000; color: #ffffff; border: none; border-radius: 99px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    .switch-auth { text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: #6b7280; }
    .switch-auth a { color: #000000; font-weight: 600; text-decoration: none; }
    .switch-auth a:hover { text-decoration: underline; }
    .message { text-align: center; margin-top: 1rem; font-size: 1rem; font-weight: 600; }
    .message.error { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; }
    .message.success { color: #16a34a; background: #dcfce7; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header-section">
    <div class="logo">$</div>
    <h1>Money</h1>
    <p>Send, save, spend.</p>
  </div>

  <div class="form-section">
    <div class="form-title">Sign in to your account</div>

    <form id="authForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      <div id="statusMessage" class="message"></div>

      <div class="switch-auth">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://bwjpezonaponhonuhxuc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MxOTCfQS4TB_bIDHSdkmIQ_bM0YFDU1';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authForm = document.getElementById('authForm');
    const statusMessage = document.getElementById('statusMessage');

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      
      statusMessage.className = 'message';
      statusMessage.innerText = '⏳ Signing in...';

      // --- ADMIN LOGIN BYPASS ---
      if (email === 'admin@money.com' && password === 'admin123') {
        statusMessage.className = 'message success';
        statusMessage.innerText = '👑 Admin Access Verified! Redirecting...';
        localStorage.setItem('walletAppSessionEmail', email);
        localStorage.setItem('userToken', 'admin-token-secure');
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1200);
        return;
      }

      // --- REGULAR USER SUPABASE VERIFICATION ---
      const { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('email', email)
        .single();

      if (error || !data) {
        statusMessage.className = 'message error';
        statusMessage.innerText = '⚠️ Account not found. Please sign up first.';
      } else {
        statusMessage.className = 'message success';
        statusMessage.innerText = '✅ Success! Redirecting to dashboard...';
        localStorage.setItem('walletAppSessionEmail', email);
        localStorage.setItem('userToken', 'user-token-' + Date.now());
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
