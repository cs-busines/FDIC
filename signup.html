<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money - Sign Up</title>

  <!-- SUPABASE CDN SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    body { 
      background-color: #000000; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      color: #ffffff; 
    }
    .header-section { 
      padding: 3rem 2rem; 
      flex-shrink: 0; 
    }
    .logo { 
      width: 48px; 
      height: 48px; 
      background-color: #22c55e; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.5rem; 
      font-weight: bold; 
      color: white; 
      margin-bottom: 1.5rem; 
    }
    h1 { 
      font-size: 2.5rem; 
      margin-bottom: 0.5rem; 
    }
    p { 
      color: #9ca3af; 
      font-size: 1.1rem; 
    }
    .form-section { 
      background-color: #f9fafb; 
      flex-grow: 1; 
      border-top-left-radius: 24px; 
      border-top-right-radius: 24px; 
      padding: 2.5rem 2rem; 
      color: #000000; 
      overflow-y: auto; 
    }
    .form-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .input-group { 
      margin-bottom: 1.5rem; 
    }
    label { 
      display: block; 
      font-size: 0.9rem; 
      font-weight: 600; 
      margin-bottom: 0.5rem; 
    }
    input { 
      width: 100%; 
      padding: 1rem; 
      border: 1px solid #e5e7eb; 
      border-radius: 12px; 
      font-size: 1rem; 
      outline: none; 
    }
    input:focus { 
      border-color: #000000; 
    }
    .helper-text {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 0.35rem;
    }
    .submit-btn { 
      width: 100%; 
      padding: 1.2rem; 
      background-color: #000000; 
      color: #ffffff; 
      border: none; 
      border-radius: 99px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 1rem; 
    }
    .switch-auth {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #6b7280;
    }
    .switch-auth a {
      color: #000000;
      font-weight: 600;
      text-decoration: none;
    }
    .switch-auth a:hover {
      text-decoration: underline;
    }
    .message { 
      text-align: center; 
      margin-top: 1rem; 
      font-size: 0.9rem; 
      font-weight: 500; 
    }
    .message.error { 
      color: #ef4444; 
    }
    .message.success { 
      color: #22c55e; 
    }
  </style>
</head>
<body>

  <div class="header-section">
    <div class="logo">$</div>
    <h1>Money</h1>
    <p>Send, save, spend.</p>
  </div>

  <div class="form-section">
    <div class="form-title">Create your account</div>

    <form id="authForm">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="e.g. James Isaac">
      </div>

      <div class="input-group">
        <label for="cashtag">Cashtag</label>
        <input type="text" id="cashtag" required placeholder="e.g. $james">
        <div class="helper-text">This unique tag will be displayed on your dashboard and profile.</div>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign up</button>
      <div id="statusMessage" class="message"></div>

      <div class="switch-auth">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </form>
  </div>

  <script>
    // --- SUPABASE INITIALIZATION ---
    const SUPABASE_URL = 'https://bwjpezonaponhonuhxuc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MxOTCfQS4TB_bIDHSdkmIQ_bM0YFDU1';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authForm = document.getElementById('authForm');
    const statusMessage = document.getElementById('statusMessage');

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      let rawTag = document.getElementById('cashtag').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      
      // Automatically format cashtag with a '$' symbol if omitted
      const formattedTag = rawTag.startsWith('$') ? rawTag : '$' + rawTag;

      statusMessage.className = 'message';
      statusMessage.innerText = 'Creating account...';

      // --- INSERT NEW USER INTO SUPABASE ---
      const { error } = await supabase
        .from('users')
        .insert([
          {
            email: email,
            name: name,
            cashtag: formattedTag,
            cash_balance: 0,
            btc_holding: 0,
            btc_price: 28507.68,
            history: []
          }
        ]);

      if (error) {
        statusMessage.className = 'message error';
        statusMessage.innerText = error.message;
      } else {
        statusMessage.className = 'message success';
        statusMessage.innerText = 'Account created successfully! Redirecting...';
        localStorage.setItem('walletAppSessionEmail', email);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }
    });
  </script>
</body>
</html>
